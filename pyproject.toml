[project]
name = "enterprise-ap-auditor"
version = "0.1.0"
description = "Copiloto Autónomo de Cuentas por Pagar y Auditoría Fiscal con LangChain y FastAPI"
authors = [
    {name = "Moises Merza", email = "moisesmerza@gmail.com"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-postgres>=0.0.12",
    "python-dotenv>=1.0.1",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.1",
    "langchain-community>=0.4.2",
    "reportlab>=5.1.0",
    "python-multipart>=0.0.33",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"